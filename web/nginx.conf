server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Foto struk maksimal 5 MB di API; beri ruang untuk overhead multipart.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Berkas ber-hash dari Vite aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html dan service worker TIDAK boleh di-cache, kalau tidak
    # pengguna tertahan di versi lama aplikasi setelah deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Header Authorization (token Supabase) diteruskan apa adanya.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
